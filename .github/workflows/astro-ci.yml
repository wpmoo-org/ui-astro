name: Astro CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  astro-verify:
    name: astro-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node tests
        run: npm test

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build demo
        run: npm run build

      - name: Verify published Core and package boundary
        run: node scripts/verify_astro_boundary.mjs --mode release
